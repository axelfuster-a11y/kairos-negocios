<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec"><meta name="description" content="Kairós: tu centro personal, privado y local.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css">
<title>Kairós — Tu centro personal</title>
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<a class="brand" href="#home"><span class="brand-mark">k</span><span><b>Kairós</b><small>tu espacio personal</small></span></a>
<div class="profile-chip"><span class="avatar">A</span><span><b>Mi espacio</b><small>Privado · Este dispositivo</small></span><i class="status-dot"></i></div>
<nav class="side-nav" aria-label="Navegación principal">
<p class="nav-label">GENERAL</p>
<button class="nav-item active" data-view="home"><span>⌂</span>Mi día</button>
<button class="nav-item" data-view="calendar"><span>▦</span>Calendario</button>
<button class="nav-item" data-view="organize"><span>☷</span>Tareas</button>
<button class="nav-item" data-view="focus"><span>◷</span>Enfoque</button>
<p class="nav-label">GESTIÓN</p>
<button class="nav-item" data-view="finance"><span>◈</span>Finanzas</button>
<button class="nav-item" data-view="projects"><span>◇</span>Proyectos</button>
<button class="nav-item" data-view="studies"><span>▤</span>Estudios</button>
<button class="nav-item" data-view="work"><span>⌑</span>Trabajo y negocios</button>
<p class="nav-label">ASISTENTE</p>
<button class="nav-item" data-view="assistant"><span>✳</span>Hablar con Kairo</button>
<button class="nav-item" data-view="settings"><span>⚙</span>Configuración</button>
</nav>
<div class="sidebar-bottom"><div class="mascot-mini"><span class="mascot-face">◡</span><div><b>Un paso a la vez.</b><small>Tu progreso cuenta.</small></div></div><button class="side-help" data-view="assistant">¿Necesitas ordenar algo? <span>→</span></button></div>
</aside>
<div class="main-column">
<header class="topbar">
<div class="mobile-brand"><span class="brand-mark">k</span><b>Kairós</b></div>
<div class="breadcrumb" id="breadcrumb">GENERAL <span>/</span> MI DÍA</div>
<div class="top-actions">
<span class="save-status"><i></i> Guardado local</span>
<button class="icon-action" id="undoBtn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>↶</button>
<button class="icon-action" id="redoBtn" title="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled>↷</button>
<button class="icon-action" id="backupBtn" title="Copia de seguridad" aria-label="Copia de seguridad">⇩</button>
<button class="avatar top-avatar" id="settingsShortcut" aria-label="Configuración">A</button>
</div>
</header>
<main id="main-content">
<section class="view active" id="view-home"></section>
<section class="view" id="view-calendar"></section>
<section class="view" id="view-organize"></section>
<section class="view" id="view-focus"></section>
<section class="view" id="view-finance"></section>
<section class="view" id="view-projects"></section>
<section class="view" id="view-studies"></section>
<section class="view" id="view-work"></section>
<section class="view" id="view-assistant"></section>
<section class="view" id="view-settings"></section>
</main>
</div>
<nav class="mobile-nav" aria-label="Navegación móvil">
<button class="active" data-view="home"><span>⌂</span>Hoy</button><button data-view="organize"><span>☷</span>Tareas</button><button class="mobile-add" id="mobileQuickAdd" aria-label="Agregar tarea"><span>＋</span></button><button data-view="finance"><span>◈</span>Plata</button><button data-view="assistant"><span>✳</span>Chat</button>
</nav>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><form id="modalForm"><div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NUEVO</p><h2 id="modalTitle">Crear</h2></div><button type="button" class="icon-action close-modal" aria-label="Cerrar">×</button></div><div id="modalFields" class="modal-fields"></div><div class="modal-actions"><button type="button" class="btn btn-quiet close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form></dialog>
<dialog id="tourDialog" aria-labelledby="tourTitle"><div class="modal-head"><div><p class="eyebrow">RECORRIDO GUIADO</p><h2 id="tourTitle">Conocé Kairós</h2></div><button type="button" class="icon-action" id="tourClose" aria-label="Cerrar">×</button></div><div id="tourBody" class="assistant-note"></div><div class="modal-actions"><button class="btn btn-quiet" id="tourPrev">Atrás</button><button class="btn btn-primary" id="tourNext">Siguiente</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="./domain.js"></script><script src="./app-core.js"></script><script src="./app-views-1.js"></script><script src="./app-views-2.js"></script><script src="./app-views-3.js"></script><script src="./app-views-4.js"></script><script src="./app-forms.js"></script><script src="./app-actions-1.js"></script><script src="./app-features-1.js"></script><script src="./app-features-2.js"></script><script src="./app-quality.js"></script>
</body></html>

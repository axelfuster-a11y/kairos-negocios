name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-governance-workflow

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static checks
        run: node tools/run-static-checks.mjs

      - name: Check whitespace
        run: git diff --check
